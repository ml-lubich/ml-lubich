<svg xmlns="http://www.w3.org/2000/svg" width="720" height="12" viewBox="0 0 720 12" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39A7FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#39A7FF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1E5FD9" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="5" width="720" height="2" rx="1" fill="url(#line)"/>
  <circle cx="360" cy="6" r="3.5" fill="#39A7FF">
    <animate attributeName="r" values="3.5;5;3.5" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="1;0.6;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cy="6" r="2" fill="#39A7FF">
    <animate attributeName="cx" values="40;680;40" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0;0.9;0;0.9;0" dur="7s" repeatCount="indefinite"/>
  </circle>
</svg>
