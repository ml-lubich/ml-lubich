<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="176" viewBox="0 0 1200 176" role="img" aria-label="Impact at a glance: 100M+ users reached, 6 published papers, 10 open-source agent tools, 5+ years shipping, ex-Apple CoreOS.">
<title>Impact at a glance: 100M+ users reached, 6 published papers, 10 open-source agent tools, 5+ years shipping, ex-Apple CoreOS.</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FFFFFF"/><stop offset="50%" stop-color="#F3F7FF"/><stop offset="100%" stop-color="#E4EDFF"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#39A7FF"/><stop offset="100%" stop-color="#1E5FD9"/>
  </linearGradient>
  <radialGradient id="glow"><stop offset="0%" stop-color="#1E5FD9" stop-opacity="0.45"/><stop offset="100%" stop-color="#1E5FD9" stop-opacity="0"/></radialGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .in { opacity: 0; animation: fadeUp .9s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes fadeUp { from { opacity: 0 } to { opacity: 1 } } /* opacity only: a CSS transform would override the SVG transform attr */
    @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
    @keyframes breathe { 0%,100% { transform: scale(1) } 50% { transform: scale(1.08) } }
    @keyframes dash { to { stroke-dashoffset: 0 } }
    
  </style>
</defs>
<rect width="1200" height="176" rx="24" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="174" rx="23" fill="none" stroke="url(#accent)" stroke-opacity="0.55"/>

<ellipse cx="1000" cy="0" rx="300" ry="120" fill="url(#glow)" style="animation:pulse 6s ease-in-out infinite"/>

<g class="in" style="animation-delay:0s" transform="translate(28,24)">
  <rect width="216" height="128" rx="18" fill="#FFFFFF" stroke="#1E5FD9" stroke-opacity=".4"/>
  <g transform="translate(174,40)">
    <circle r="18" fill="none" stroke="#1E5FD9" stroke-opacity=".25" stroke-width="3"/>
    <circle r="18" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" transform="rotate(-90)" stroke-dasharray="113.1" stroke-dashoffset="113.1" style="animation:dash 1.6s 0.2s cubic-bezier(.2,.7,.2,1) forwards"/>
    <circle r="4" fill="#1E5FD9" style="animation:pulse 2.4s 0s ease-in-out infinite"/>
  </g>
  <text x="22" y="58" fill="#1E5FD9" font-size="30" font-weight="800" letter-spacing="-1">100M+</text>
  <text x="22" y="84" fill="#0A1F44" font-size="14" font-weight="700">users reached</text>
  <text x="22" y="106" fill="#4B5C75" font-size="12">production AI at consumer scale</text>
</g>
<g class="in" style="animation-delay:0.12s" transform="translate(260,24)">
  <rect width="216" height="128" rx="18" fill="#FFFFFF" stroke="#1E5FD9" stroke-opacity=".4"/>
  <g transform="translate(174,40)">
    <circle r="18" fill="none" stroke="#1E5FD9" stroke-opacity=".25" stroke-width="3"/>
    <circle r="18" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" transform="rotate(-90)" stroke-dasharray="113.1" stroke-dashoffset="113.1" style="animation:dash 1.6s 0.35s cubic-bezier(.2,.7,.2,1) forwards"/>
    <circle r="4" fill="#1E5FD9" style="animation:pulse 2.4s 0.3s ease-in-out infinite"/>
  </g>
  <text x="22" y="58" fill="#1E5FD9" font-size="38" font-weight="800" letter-spacing="-1">6</text>
  <text x="22" y="84" fill="#0A1F44" font-size="14" font-weight="700">published papers</text>
  <text x="22" y="106" fill="#4B5C75" font-size="12">ML &amp; hydrology · Google Scholar</text>
</g>
<g class="in" style="animation-delay:0.24s" transform="translate(492,24)">
  <rect width="216" height="128" rx="18" fill="#FFFFFF" stroke="#1E5FD9" stroke-opacity=".4"/>
  <g transform="translate(174,40)">
    <circle r="18" fill="none" stroke="#1E5FD9" stroke-opacity=".25" stroke-width="3"/>
    <circle r="18" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" transform="rotate(-90)" stroke-dasharray="113.1" stroke-dashoffset="113.1" style="animation:dash 1.6s 0.5s cubic-bezier(.2,.7,.2,1) forwards"/>
    <circle r="4" fill="#1E5FD9" style="animation:pulse 2.4s 0.6s ease-in-out infinite"/>
  </g>
  <text x="22" y="58" fill="#1E5FD9" font-size="38" font-weight="800" letter-spacing="-1">10</text>
  <text x="22" y="84" fill="#0A1F44" font-size="14" font-weight="700">open-source tools</text>
  <text x="22" y="106" fill="#4B5C75" font-size="12">CLI + MCP · brew ml-lubich/tap</text>
</g>
<g class="in" style="animation-delay:0.36s" transform="translate(724,24)">
  <rect width="216" height="128" rx="18" fill="#FFFFFF" stroke="#1E5FD9" stroke-opacity=".4"/>
  <g transform="translate(174,40)">
    <circle r="18" fill="none" stroke="#1E5FD9" stroke-opacity=".25" stroke-width="3"/>
    <circle r="18" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" transform="rotate(-90)" stroke-dasharray="113.1" stroke-dashoffset="113.1" style="animation:dash 1.6s 0.6499999999999999s cubic-bezier(.2,.7,.2,1) forwards"/>
    <circle r="4" fill="#1E5FD9" style="animation:pulse 2.4s 0.8999999999999999s ease-in-out infinite"/>
  </g>
  <text x="22" y="58" fill="#1E5FD9" font-size="38" font-weight="800" letter-spacing="-1">5+</text>
  <text x="22" y="84" fill="#0A1F44" font-size="14" font-weight="700">years shipping</text>
  <text x="22" y="106" fill="#4B5C75" font-size="12">Apple · Walmart · LBNL · Polaris</text>
</g>
<g class="in" style="animation-delay:0.48s" transform="translate(956,24)">
  <rect width="216" height="128" rx="18" fill="#FFFFFF" stroke="#1E5FD9" stroke-opacity=".4"/>
  <g transform="translate(174,40)">
    <circle r="18" fill="none" stroke="#1E5FD9" stroke-opacity=".25" stroke-width="3"/>
    <circle r="18" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" transform="rotate(-90)" stroke-dasharray="113.1" stroke-dashoffset="113.1" style="animation:dash 1.6s 0.8s cubic-bezier(.2,.7,.2,1) forwards"/>
    <circle r="4" fill="#1E5FD9" style="animation:pulse 2.4s 1.2s ease-in-out infinite"/>
  </g>
  <text x="22" y="58" fill="#1E5FD9" font-size="30" font-weight="800" letter-spacing="-1">ex-Apple</text>
  <text x="22" y="84" fill="#0A1F44" font-size="14" font-weight="700">CoreOS · File Systems</text>
