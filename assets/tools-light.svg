<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Open-source agent tool family by Misha Lubich: imsg, imail, inotes, wa (WhatsApp), bb (bitbucket-cli), confluence-cli, pdfify-md, jenkins-mcp, twig, like-fable — each a CLI plus an MCP server. Homebrew tap ml-lubich/tap.">
<title>Open-source agent tool family by Misha Lubich: imsg, imail, inotes, wa (WhatsApp), bb (bitbucket-cli), confluence-cli, pdfify-md, jenkins-mcp, twig, like-fable — each a CLI plus an MCP server. Homebrew tap ml-lubich/tap.</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FFFFFF"/><stop offset="50%" stop-color="#F3F7FF"/><stop offset="100%" stop-color="#E4EDFF"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#39A7FF"/><stop offset="100%" stop-color="#1E5FD9"/>
  </linearGradient>
  <radialGradient id="glow"><stop offset="0%" stop-color="#1E5FD9" stop-opacity="0.45"/><stop offset="100%" stop-color="#1E5FD9" stop-opacity="0"/></radialGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .in { opacity: 0; animation: fadeUp .9s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes fadeUp { from { opacity: 0 } to { opacity: 1 } } /* opacity only: a CSS transform would override the SVG transform attr */
    @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
    @keyframes breathe { 0%,100% { transform: scale(1) } 50% { transform: scale(1.08) } }
    @keyframes dash { to { stroke-dashoffset: 0 } }
    
  </style>
</defs>
<rect width="1200" height="600" rx="24" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="598" rx="23" fill="none" stroke="url(#accent)" stroke-opacity="0.55"/>

