<text x="40" y="40" fill="#1E5FD9" font-size="12" font-weight="700" letter-spacing="3">OPEN-SOURCE AGENT TOOLS</text>
<text x="1160" y="40" text-anchor="end" fill="#4B5C75" font-size="12">every tool = human CLI <tspan fill="#1E5FD9" font-weight="700">+</tspan> MCP / agent surface</text>

