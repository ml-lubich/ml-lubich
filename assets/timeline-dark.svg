  <line x1="126.5" y1="170" x2="126.5" y2="202" stroke="#39A7FF" stroke-opacity=".45" stroke-dasharray="2 3"/>
  <circle cx="126.5" cy="170" r="6" fill="#081A36" stroke="#39A7FF" stroke-width="2.5"/>
  
  <g text-anchor="start" transform="translate(126.5,0)">
  <text y="228" fill="#E6EDF3" font-size="15" font-weight="800">LBNL</text>
  <text y="245" fill="#9FB3C8" font-size="11.5">Software Engineer · ML on environmental data</text>
  <text y="210" fill="#39A7FF" font-size="10.5" font-weight="700" letter-spacing=".8">MAY 2021 – AUG 2021</text>
  </g>
</g>
<g class="in" style="animation-delay:1.06s">
  <rect x="296.1" y="165" width="42.4" height="10" rx="5" fill="#1E5FD9" opacity="0.85"/>
  <line x1="296.1" y1="170" x2="296.1" y2="126" stroke="#39A7FF" stroke-opacity=".45" stroke-dasharray="2 3"/>
  <circle cx="296.1" cy="170" r="6" fill="#081A36" stroke="#39A7FF" stroke-width="2.5"/>
  
  <g text-anchor="start" transform="translate(296.1,0)">
  <text y="118" fill="#E6EDF3" font-size="15" font-weight="800">Walmart</text>
  <text y="135" fill="#9FB3C8" font-size="11.5">Software Engineer · ad-targeting ML</text>
  <text y="100" fill="#39A7FF" font-size="10.5" font-weight="700" letter-spacing=".8">MAY 2022 – AUG 2022</text>
  </g>
</g>
<g class="in" style="animation-delay:1.34s">
  <rect x="409.2" y="165" width="254.4" height="10" rx="5" fill="#1E5FD9" opacity="0.85"/>
  <line x1="409.2" y1="170" x2="409.2" y2="202" stroke="#39A7FF" stroke-opacity=".45" stroke-dasharray="2 3"/>
  <circle cx="409.2" cy="170" r="6" fill="#081A36" stroke="#39A7FF" stroke-width="2.5"/>
  
  <g text-anchor="start" transform="translate(409.2,0)">
  <text y="228" fill="#E6EDF3" font-size="15" font-weight="800">Apple</text>
  <text y="245" fill="#9FB3C8" font-size="11.5">SDET · CoreOS / File Systems (APFS)</text>
  <text y="210" fill="#39A7FF" font-size="10.5" font-weight="700" letter-spacing=".8">JAN 2023 – JUL 2024</text>
  </g>
</g>
<g class="in" style="animation-delay:1.62s">
  <rect x="691.9" y="165" width="339.2" height="10" rx="5" fill="#1E5FD9" opacity="0.85"/>
  <line x1="691.9" y1="170" x2="691.9" y2="126" stroke="#39A7FF" stroke-opacity=".45" stroke-dasharray="2 3"/>
  <circle cx="691.9" cy="170" r="6" fill="#081A36" stroke="#39A7FF" stroke-width="2.5"/>
  
  <g text-anchor="start" transform="translate(691.9,0)">
  <text y="118" fill="#E6EDF3" font-size="15" font-weight="800">Polaris Wireless</text>
  <text y="135" fill="#9FB3C8" font-size="11.5">Platform &amp; AI Engineer · MCP, vLLM, ClickHouse</text>
  <text y="100" fill="#39A7FF" font-size="10.5" font-weight="700" letter-spacing=".8">SEP 2024 – SEP 2026</text>
  </g>
</g>
<g class="in" style="animation-delay:1.9000000000000001s">
  <rect x="1031.1" y="165" width="98.9" height="10" rx="5" fill="url(#accent)" opacity="1"/>
  <line x1="1031.1" y1="170" x2="1031.1" y2="202" stroke="#39A7FF" stroke-opacity=".45" stroke-dasharray="2 3"/>
  <circle cx="1031.1" cy="170" r="6" fill="#081A36" stroke="#39A7FF" stroke-width="2.5"/>
  <circle cx="1031.1" cy="170" r="6" fill="none" stroke="#39A7FF" stroke-width="2"><animate attributeName="r" values="6;22" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0" dur="2s" repeatCount="indefinite"/></circle>
  <g text-anchor="end" transform="translate(1130,0)">
  <text y="228" fill="#E6EDF3" font-size="17" font-weight="800">EchoStar</text>
  <text y="245" fill="#9FB3C8" font-size="11.5">Staff AI Engineer · agents, RAG, evals at consumer scale</text>
  <text y="210" fill="#39A7FF" font-size="10.5" font-weight="700" letter-spacing=".8">SEP 2026 – NOW</text>
