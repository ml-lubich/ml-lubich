<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Career timeline: Honda Innovations (2021), Lawrence Berkeley National Laboratory (2021), Walmart (2022), Apple CoreOS / File Systems (2023–2024), UC Berkeley B.A. CS 2023, Polaris Wireless (2024–2026), EchoStar Staff AI Engineer (Sep 2026–present). Offers and final rounds at Anduril and Mach Industries in 2026.">
<title>Career timeline: Honda Innovations (2021), Lawrence Berkeley National Laboratory (2021), Walmart (2022), Apple CoreOS / File Systems (2023–2024), UC Berkeley B.A. CS 2023, Polaris Wireless (2024–2026), EchoStar Staff AI Engineer (Sep 2026–present). Offers and final rounds at Anduril and Mach Industries in 2026.</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#071428"/><stop offset="50%" stop-color="#0A1F44"/><stop offset="100%" stop-color="#10306A"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#1E5FD9"/><stop offset="100%" stop-color="#39A7FF"/>
  </linearGradient>
  <radialGradient id="glow"><stop offset="0%" stop-color="#39A7FF" stop-opacity="0.45"/><stop offset="100%" stop-color="#39A7FF" stop-opacity="0"/></radialGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .in { opacity: 0; animation: fadeUp .9s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes fadeUp { from { opacity: 0 } to { opacity: 1 } } /* opacity only: a CSS transform would override the SVG transform attr */
    @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
    @keyframes breathe { 0%,100% { transform: scale(1) } 50% { transform: scale(1.08) } }
    @keyframes dash { to { stroke-dashoffset: 0 } }
    
  </style>
</defs>
<rect width="1200" height="330" rx="24" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="328" rx="23" fill="none" stroke="url(#accent)" stroke-opacity="0.55"/>

<ellipse cx="1050" cy="170" rx="260" ry="120" fill="url(#glow)" style="animation:pulse 6s ease-in-out infinite"/>
<text x="40" y="44" fill="#39A7FF" font-size="12" font-weight="700" letter-spacing="3">CAREER TIMELINE</text>
<text x="40" y="66" fill="#9FB3C8" font-size="13">Six years, six teams — from research intern to Staff AI Engineer.</text>
<!-- year ticks -->
<g font-size="11" fill="#9FB3C8" text-anchor="middle">
<line x1="70" y1="164" x2="70" y2="176" stroke="#9FB3C8" stroke-opacity=".5"/><text x="70" y="194" opacity=".8">2021</text><line x1="239.6" y1="164" x2="239.6" y2="176" stroke="#9FB3C8" stroke-opacity=".5"/><text x="239.6" y="194" opacity=".8">2022</text><line x1="409.2" y1="164" x2="409.2" y2="176" stroke="#9FB3C8" stroke-opacity=".5"/><text x="409.2" y="194" opacity=".8">2023</text><line x1="578.8" y1="164" x2="578.8" y2="176" stroke="#9FB3C8" stroke-opacity=".5"/><text x="578.8" y="194" opacity=".8">2024</text><line x1="748.4" y1="164" x2="748.4" y2="176" stroke="#9FB3C8" stroke-opacity=".5"/><text x="748.4" y="194" opacity=".8">2025</text><line x1="918" y1="164" x2="918" y2="176" stroke="#9FB3C8" stroke-opacity=".5"/><text x="918" y="194" opacity=".8">2026</text>
</g>
<line x1="70" y1="170" x2="1130" y2="170" stroke="#39A7FF" stroke-opacity=".3" stroke-width="2"/>
<line x1="70" y1="170" x2="1130" y2="170" stroke="url(#accent)" stroke-width="2" stroke-dasharray="1060" stroke-dashoffset="1060" style="animation:dash 2.4s cubic-bezier(.4,0,.2,1) forwards"/>
<!-- role bars -->

<g class="in" style="animation-delay:0.5s">
