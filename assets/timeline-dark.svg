<!-- Berkeley graduation flag -->
<g class="in" style="animation-delay:1.6s" transform="translate(465.7,170)">
  <line y1="0" y2="-32" stroke="#7DD3FC" stroke-width="1.5"/>
  <path d="M0,-32 h130 l-8,9 8,9 h-130 z" fill="#7DD3FC" opacity=".9"/>
  <text x="6" y="-19" fill="#06182F" font-size="9.5" font-weight="800" letter-spacing=".5">UC BERKELEY CS '23</text>
</g>
<!-- honest side-note -->
<g class="in" style="animation-delay:2.4s" transform="translate(40,298)">
  <circle cx="5" cy="-4" r="3" fill="#39A7FF"/>
  <text x="16" fill="#9FB3C8" font-size="11.5">2026: offers &amp; final rounds at <tspan fill="#E6EDF3" font-weight="700">Anduril</tspan> and <tspan fill="#E6EDF3" font-weight="700">Mach Industries</tspan> — chose EchoStar for consumer-scale impact.</text>
