  <circle cx="70" cy="170" r="6" fill="#081A36" stroke="#39A7FF" stroke-width="2.5"/>
  
  <g text-anchor="start" transform="translate(70,0)">
  <text y="118" fill="#E6EDF3" font-size="15" font-weight="800">Honda Innovations</text>
  <text y="135" fill="#9FB3C8" font-size="11.5">SWE Intern · ML route optimization</text>
  <text y="100" fill="#39A7FF" font-size="10.5" font-weight="700" letter-spacing=".8">JAN 2021 – MAY 2021</text>
